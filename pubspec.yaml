name: diginiwas
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Location
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Networking
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.4.0

  # Secure storage (tokens)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Push notifications
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2
  image_picker: ^1.1.2
  google_maps_flutter: ^2.5.3 # (ya latest version)

  # Responsive sizing
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  panorama_viewer: ^2.0.7
  url_launcher: ^6.3.0
  share_plus: ^12.0.2
  # Logging
  logger: ^2.4.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
